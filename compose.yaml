name: pulsemix
services:
  api:
    image: pulsemix-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: api
    volumes:
      - audio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped

  web:
    image: pulsemix-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: web
    ports:
      - "127.0.0.1:${PULSEMIX_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true
    restart: unless-stopped

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: api-test

  engine-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: engine-test

  web-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: web-test
    environment:
      BASE_URL: http://localhost:8080
    # Share the web container's network so AudioWorklet sees a real secure localhost origin.
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
    shm_size: 1gb

volumes:
  audio-data:
